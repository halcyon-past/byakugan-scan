name: Publish Release & DMG Installer

on:
  push:
    branches:
      - main
    paths:
      - 'ByakuganScan/Shared/Constants/AppConstants.swift'
      - 'project.yml'
      - 'Casks/byakugan-scan.rb'
  workflow_dispatch:
    inputs:
      custom_message:
        description: 'Optional announcement message (displayed directly after the heading)'
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, Package & Publish Release
    runs-on: macos-14
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract Current App Version
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'static let version =' ByakuganScan/Shared/Constants/AppConstants.swift | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "❌ ERROR: Could not extract version from ByakuganScan/Shared/Constants/AppConstants.swift!"
            exit 1
          fi
          echo "CURRENT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          echo "📌 Current version identified: $VERSION (Tag: v$VERSION)"

      - name: Check Release Existence & Determine Mode
        id: check-version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Checking if release $TAG_NAME already exists in ${{ github.repository }}..."

          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Release $TAG_NAME already exists on GitHub!"
              echo "❌ THE MANUAL RELEASE WORKFLOW FAILED BECAUSE $TAG_NAME IS ALREADY PUBLISHED."
              echo "To publish a new release, increment the version in AppConstants.swift, project.yml, and CHANGELOG.md."
              exit 1
            fi
            echo "ℹ️ Release $TAG_NAME already exists on GitHub. Skipping DMG rebuild and verifying Homebrew tap sync."
            echo "is_new_release=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Verified: $TAG_NAME is a new, unpublished version. Proceeding with full release build."
            echo "is_new_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js 20
        if: steps.check-version.outputs.is_new_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install Website Dependencies
        if: steps.check-version.outputs.is_new_release == 'true'
        working-directory: ./website
        run: npm ci

      - name: Execute Automated Test Suites
        if: steps.check-version.outputs.is_new_release == 'true'
        shell: bash
        run: |
          chmod +x ./scripts/run_tests.sh
          ./scripts/run_tests.sh

      - name: Build Signed App & Package Installer DMG
        if: steps.check-version.outputs.is_new_release == 'true'
        shell: bash
        run: |
          chmod +x ./scripts/build_app.sh
          chmod +x ./scripts/package_dmg.sh
          ./scripts/package_dmg.sh

      - name: Verify Release Artifacts & Compute DMG SHA-256
        if: steps.check-version.outputs.is_new_release == 'true'
        shell: bash
        run: |
          for file in "build/ByakuganScan.dmg" "build/ByakuganScan-v$CURRENT_VERSION.dmg" "build/ByakuganScan.zip" "build/ByakuganScan-v$CURRENT_VERSION.zip"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file was not generated!"
              exit 1
            fi
          done
          ls -lh build/*.dmg build/*.zip
          DMG_SHA256=$(shasum -a 256 "build/ByakuganScan-v$CURRENT_VERSION.dmg" | awk '{print $1}')
          echo "DMG_SHA256=$DMG_SHA256" >> $GITHUB_ENV
          echo "🔐 Computed DMG SHA-256: $DMG_SHA256"

      - name: Generate Formatted Release Notes
        if: steps.check-version.outputs.is_new_release == 'true'
        shell: bash
        env:
          CUSTOM_MESSAGE: ${{ github.event.inputs.custom_message }}
        run: |
          python3 scripts/generate_release_notes.py \
            --version "$CURRENT_VERSION" \
            --custom-message "$CUSTOM_MESSAGE" \
            --changelog "CHANGELOG.md" \
            --output "RELEASE_NOTES.md" \
            --repo "${{ github.repository }}"

      - name: Publish GitHub Release & Upload Assets
        if: steps.check-version.outputs.is_new_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Creating GitHub Release $TAG_NAME and attaching DMG and ZIP installers..."
          gh release create "$TAG_NAME" \
            "build/ByakuganScan.dmg#ByakuganScan.dmg (Latest Direct Download)" \
            "build/ByakuganScan-v$CURRENT_VERSION.dmg#ByakuganScan-v$CURRENT_VERSION.dmg" \
            "build/ByakuganScan.zip#ByakuganScan.zip (In-Place Auto-Updater)" \
            "build/ByakuganScan-v$CURRENT_VERSION.zip#ByakuganScan-v$CURRENT_VERSION.zip" \
            --title "Byakugan Scan v$CURRENT_VERSION" \
            --notes-file "RELEASE_NOTES.md"

      - name: Fetch Existing Release DMG SHA-256 (If Release Already Exists)
        if: steps.check-version.outputs.is_new_release == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIGEST=$(gh release view "$TAG_NAME" --repo "${{ github.repository }}" --json assets --jq ".assets[] | select(.name == \"ByakuganScan-v$CURRENT_VERSION.dmg\") | .digest" | sed 's/^sha256://')
          if [ -z "$DIGEST" ]; then
            DIGEST=$(grep 'sha256 "' Casks/byakugan-scan.rb | sed -E 's/.*"([0-9a-f]{64})".*/\1/')
          fi
          echo "DMG_SHA256=$DIGEST" >> $GITHUB_ENV
          echo "🔐 Resolved existing DMG SHA-256: $DIGEST"

      - name: Synchronize Homebrew Cask & Website Checksum (Local + halcyon-past/homebrew-tap)
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/sync_homebrew_tap.py
          python3 ./scripts/sync_homebrew_tap.py \
            --version "$CURRENT_VERSION" \
            --sha256 "$DMG_SHA256"

          # Commit & sync back to main, uat, and dev only if local files changed
          if ! git diff --quiet Casks/byakugan-scan.rb website/src/app/page.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/byakugan-scan.rb website/src/app/page.tsx
            git commit -m "chore(release): auto-sync v$CURRENT_VERSION DMG SHA-256 across cask and website [skip ci]"
            git push origin HEAD:main
            git fetch origin uat dev
            git push origin HEAD:uat || true
            git push origin HEAD:dev || true
            echo "✅ Synced updated SHA-256 checksum across main, uat, and dev."
          else
            echo "✅ Local Cask and Website already contain the latest SHA-256; no extra commit needed."
          fi
