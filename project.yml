name: ByakuganScan
options:
  bundleIdPrefix: cloud.aritro
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  indentWidth: 4
  tabWidth: 4
  usesTabs: false
  createIntermediateGroups: true
  postGenCommand: echo "✅ Xcode project generated successfully!"

settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  MARKETING_VERSION: "1.0.5"
  CURRENT_PROJECT_VERSION: "6"
  PRODUCT_BUNDLE_IDENTIFIER: "cloud.aritro.byakugan-scan"
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: ""
  ENABLE_HARDENED_RUNTIME: YES
  SWIFT_STRICT_CONCURRENCY: complete

targets:
  ByakuganScan:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    info:
      path: ByakuganScan/Resources/Info.plist
      properties:
        CFBundleName: Byakugan Scan
        CFBundleDisplayName: Byakugan Scan
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: "© 2026 Aritro Saha. All rights reserved."
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSScreenCaptureUsageDescription: "Byakugan Scan needs to capture your screen to extract text and scan QR/barcodes from the selected region."
        NSSpeechRecognitionUsageDescription: "Speech recognition may be used for accessibility features."
        ITSAppUsesNonExemptEncryption: false
        LSMultipleInstancesProhibited: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleURLTypes:
          - CFBundleURLName: "cloud.aritro.byakugan-scan"
            CFBundleURLSchemes:
              - "byakugan"

    entitlements:
      path: ByakuganScan/ByakuganScan.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.files.absolute-path.read-write:
          - "/tmp/"
        com.apple.security.network.client: true

    sources:
      - path: ByakuganScan
        excludes:
          - "**/*.md"
          - "**/*.txt"
          - Resources/Info.plist
          - ByakuganScan.entitlements

    resources:
      - path: ByakuganScan/Resources/Assets.xcassets

    settings:
      base:
        PRODUCT_NAME: "Byakugan Scan"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      debug:
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        DEBUG_INFORMATION_FORMAT: dwarf
        ONLY_ACTIVE_ARCH: YES
      release:
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
        VALIDATE_PRODUCT: YES
        ENABLE_TESTABILITY: NO

schemes:
  ByakuganScan:
    build:
      targets:
        ByakuganScan: all
    run:
      config: Debug
      environmentVariables:
        - variable: OS_ACTIVITY_MODE
          value: disable
          isEnabled: false
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      archiveName: ByakuganScan
